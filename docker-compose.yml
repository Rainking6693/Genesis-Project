version: '3.8'

services:
  # Genesis A2A Service - Main web service
  a2a-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-a2a-service
    ports:
      - "8000:8000"
    environment:
      - GENESIS_ENV=production
      - A2A_HOST=0.0.0.0
      - A2A_PORT=8000
      - LOG_LEVEL=INFO
    env_file:
      - .env.production
    volumes:
      # Mount infrastructure directory (for development)
      - ./infrastructure:/app/infrastructure:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genesis-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - genesis-redis
      - genesis-mongodb

  # Genesis MongoDB - Shared memory storage
  genesis-mongodb:
    image: mongo:7
    container_name: genesis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=genesis
      - MONGO_INITDB_ROOT_USERNAME=genesis
      - MONGO_INITDB_ROOT_PASSWORD=genesis_password
    networks:
      - genesis-network
    profiles:
      - database

  # Genesis Redis - Caching and state management
  genesis-redis:
    image: redis:7-alpine
    container_name: genesis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - genesis-network
    profiles:
      - cache

  # DeepSeek-OCR Service - Document OCR (CPU-optimized)
  deepseek-ocr:
    build:
      context: .
      dockerfile: infrastructure/docker/deepseek-ocr-cpu.Dockerfile
    container_name: deepseek-ocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data/ocr_cache:/cache
      - ./data/ocr_test_images:/test_images:ro
    environment:
      - OCR_SERVICE_PORT=8001
      - CACHE_DIR=/cache
      - ENABLE_CACHE=true
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - ocr

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: genesis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - genesis-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: genesis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - genesis-network
    profiles:
      - monitoring

volumes:
  mongodb-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  genesis-network:
    driver: bridge
    name: genesis-network
