# =============================================================================
# HARD TESTS (51-75): Full Squad & Complex Scenarios
# =============================================================================
hard_tests:
  # Full Website Build (5 tests)
  - id: H51
    name: "E-commerce Product Page"
    difficulty: hard
    type: team
    squad: delivery_squad
    agents: [builder_agent_enhanced, qa_agent, seo_agent, deploy_agent]
    task: |
      Build complete e-commerce product page with:
      image gallery, variants, add to cart, reviews, SEO.
      Include tests and deployment config.
    success_criteria:
      - image_gallery: true
      - variant_selector: true
      - cart_integration: true
      - review_section: true
