# Genesis Production Deployment - Complete Multi-Service Stack
# ============================================
# Integrates: A2A Service, Autonomous Scheduler, Skyvern, ES Evaluation
# Security: Production-grade hardening, secrets management, resource limits
# Monitoring: Prometheus, Grafana, health checks
# Created: November 8, 2025
# Updated: November 8, 2025

version: '3.8'

services:
  # ============================================
  # CORE SERVICES
  # ============================================

  # Genesis A2A Service - Main web API
  a2a-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-a2a-service
    ports:
      - "8000:8000"
    environment:
      - GENESIS_ENV=production
      - A2A_HOST=0.0.0.0
      - A2A_PORT=8000
      - LOG_LEVEL=INFO
      - MONGODB_HOST=genesis-mongodb
      - MONGODB_PORT=27017
      - REDIS_HOST=genesis-redis
      - REDIS_PORT=6379
    env_file:
      - .env.production
    volumes:
      - ./infrastructure:/app/infrastructure:ro
      - a2a-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - genesis-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      genesis-redis:
        condition: service_healthy
      genesis-mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Autonomous Business Scheduler - 24/7 worker
  autonomous-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genesis-autonomous-scheduler
    environment:
      - GENESIS_ENV=production
      - LOG_LEVEL=INFO
      - SCHEDULER_MIN_INTERVAL=300  # 5 minutes
      - SCHEDULER_MAX_INTERVAL=600  # 10 minutes
      - MONGODB_HOST=genesis-mongodb
      - MONGODB_PORT=27017
      - REDIS_HOST=genesis-redis
      - REDIS_PORT=6379
    env_file:
      - .env.production
    volumes:
      - ./scripts:/app/scripts:ro
      - ./infrastructure:/app/infrastructure:ro
      - scheduler-data:/var/genesis
      - scheduler-logs:/app/logs
    restart: unless-stopped
    command: ["python", "scripts/autonomous_scheduler.py", "--min-interval", "5", "--max-interval", "10"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/genesis_scheduler_heartbeat.json"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - genesis-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      genesis-redis:
        condition: service_healthy
      genesis-mongodb:
        condition: service_healthy
      a2a-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # ============================================
  # INTEGRATION SERVICES
  # ============================================

  # Skyvern - Browser automation
  skyvern-backend:
    image: skyvern/skyvern:latest
    container_name: genesis-skyvern
    ports:
      - "8001:8000"
    secrets:
      - skyvern_api_key
      - openai_api_key
      - anthropic_api_key
      - skyvern_db_password
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=skyvern-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=skyvern
      - POSTGRES_USER=skyvern
      - POSTGRES_PASSWORD_FILE=/run/secrets/skyvern_db_password
      - SKYVERN_API_KEY_FILE=/run/secrets/skyvern_api_key
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
    volumes:
      - ./skyvern_tasks:/app/tasks:ro
      - ./skyvern_workflows:/app/workflows:ro
      - ./skyvern_data:/app/data
      - skyvern_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - genesis-network
    depends_on:
      skyvern-postgres:
        condition: service_healthy

  skyvern-postgres:
    image: postgres:15-alpine
    container_name: genesis-skyvern-db
    secrets:
      - skyvern_db_password
    environment:
      - POSTGRES_USER=skyvern
      - POSTGRES_DB=skyvern
      - POSTGRES_PASSWORD_FILE=/run/secrets/skyvern_db_password
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - skyvern_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyvern"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - genesis-network

  # Evolution Strategies Evaluation (nightly training)
  es-evaluation:
    image: python:3.12-slim
    container_name: genesis-es-eval
    networks:
      - genesis-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/evolution_strategies:/app/evolution_strategies:ro
      - ./tests/fixtures:/app/fixtures:ro
      - es-eval-tmp:/tmp
      - es-eval-logs:/app/logs
      - es-eval-models:/app/models
    working_dir: /app
    user: "1000:1000"
    environment:
      - ES_EVAL_MODE=PRODUCTION
      - ES_EVAL_MOCK=false
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - MONGODB_HOST=genesis-mongodb
      - MONGODB_PORT=27017
    env_file:
      - .env.production
    command: >
      sh -c "
        pip install --no-cache-dir numpy torch==2.1.0 --index-url https://download.pytorch.org/whl/cpu &&
        python evolution_strategies/eval_sandbox.py
      "
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # This service is triggered by cron, not running continuously
    # Use external cron job (Railway/Render) to start this container nightly
    profiles:
      - training

  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================

  # MongoDB - Shared memory storage
  genesis-mongodb:
    image: mongo:7
    container_name: genesis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=genesis
      - MONGO_INITDB_ROOT_USERNAME=genesis
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongodb_password
    secrets:
      - mongodb_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - genesis-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # Redis - Caching and state management
  genesis-redis:
    image: redis:7-alpine
    container_name: genesis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - genesis-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # DeepSeek-OCR Service - Document OCR (CPU-optimized)
  deepseek-ocr:
    build:
      context: .
      dockerfile: infrastructure/docker/deepseek-ocr-cpu.Dockerfile
    container_name: deepseek-ocr
    restart: unless-stopped
    ports:
      - "8002:8001"
    volumes:
      - ./data/ocr_cache:/cache
      - ./data/ocr_test_images:/test_images:ro
      - ocr-logs:/app/logs
    environment:
      - OCR_SERVICE_PORT=8001
      - CACHE_DIR=/cache
      - ENABLE_CACHE=true
      - LOG_LEVEL=INFO
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
      - no-new-privileges:true

  # ============================================
  # MONITORING SERVICES
  # ============================================

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: genesis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: genesis-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.genesis.ai
      - GF_ANALYTICS_REPORTING_ENABLED=false
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - genesis-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    security_opt:
      - no-new-privileges:true

  # Alertmanager - Alert routing
  alertmanager:
    image: prom/alertmanager:latest
    container_name: genesis-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - genesis-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    security_opt:
      - no-new-privileges:true

# ============================================
# DOCKER SECRETS (Production)
# ============================================
secrets:
  skyvern_api_key:
    file: ./secrets/skyvern_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  skyvern_db_password:
    file: ./secrets/skyvern_db_password.txt
  mongodb_password:
    file: ./secrets/mongodb_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

# ============================================
# PERSISTENT VOLUMES
# ============================================
volumes:
  # Core service data
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local

  # Service logs
  a2a-logs:
    driver: local
  scheduler-logs:
    driver: local
  skyvern_logs:
    driver: local
  ocr-logs:
    driver: local

  # Service data
  scheduler-data:
    driver: local
  skyvern_db:
    driver: local

  # ES evaluation
  es-eval-tmp:
    driver: local
  es-eval-logs:
    driver: local
  es-eval-models:
    driver: local

  # Monitoring
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  genesis-network:
    driver: bridge
    name: genesis-production
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# DEPLOYMENT COMMANDS
# ============================================
#
# Full production stack:
#   docker-compose -f docker-compose.production.yml up -d
#
# Core services only (no monitoring):
#   docker-compose -f docker-compose.production.yml up -d a2a-service autonomous-scheduler genesis-mongodb genesis-redis
#
# With Skyvern:
#   docker-compose -f docker-compose.production.yml up -d a2a-service autonomous-scheduler skyvern-backend
#
# Nightly ES training (manual trigger):
#   docker-compose -f docker-compose.production.yml --profile training up es-evaluation
#
# View logs:
#   docker-compose -f docker-compose.production.yml logs -f [service-name]
#
# Health check all services:
#   docker-compose -f docker-compose.production.yml ps
#
# Scale services:
#   docker-compose -f docker-compose.production.yml up -d --scale a2a-service=3
#
# ============================================
# PRODUCTION CHECKLIST
# ============================================
#
# Before deploying:
# 1. Create secrets directory: mkdir -p secrets/
# 2. Generate secrets:
#    - secrets/skyvern_api_key.txt
#    - secrets/openai_api_key.txt
#    - secrets/anthropic_api_key.txt
#    - secrets/skyvern_db_password.txt
#    - secrets/mongodb_password.txt
#    - secrets/grafana_admin_password.txt
# 3. Create .env.production with:
#    - REDIS_PASSWORD
#    - OPENAI_API_KEY
#    - ANTHROPIC_API_KEY
#    - GOOGLE_API_KEY
# 4. Configure monitoring/prometheus.yml
# 5. Configure monitoring/alertmanager.yml
# 6. Test with: docker-compose -f docker-compose.production.yml config
# 7. Deploy with: docker-compose -f docker-compose.production.yml up -d
# 8. Monitor with: docker-compose -f docker-compose.production.yml logs -f
# 9. Access Grafana: http://localhost:3000 (admin/[secret])
# 10. Access Prometheus: http://localhost:9090
#
