# Day 2 Bootcamp - Batch 4: 100 Test Scenarios
# Genesis + 11 Agents: API, Backend Integration & Data Management
# IDs: B4_E01-E25 (Easy), B4_I01-I25 (Intermediate), B4_H01-H25 (Hard), B4_X01-X25 (Extreme)

metadata:
  version: "4.0"
  batch: 4
  total_tests: 100
  focus: "api_backend_data"
  agents:
    - genesis_meta
    - analyst_agent
    - builder_agent_enhanced
    - deploy_agent
    - billing_agent
    - emergency_error_specialist_agent
    - marketing_agent
    - support_agent
    - onboarding_agent
    - qa_agent
    - se_darwin_agent
    - seo_agent

