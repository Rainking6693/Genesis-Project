      Builder creates a React landing page with hero, features, pricing.
      Deploy agent sets up CI/CD to Netlify with preview deploys.
    success_criteria:
      - react_app_valid: true
      - components_created: ["Hero", "Features", "Pricing"]
      - netlify_config: true
      - preview_deploys: true
    timeout_seconds: 300
    reward_weight: 1.5

  - id: I27
    name: "Setup Next.js with SSG"
    difficulty: intermediate
    type: team
    squad: delivery_squad
    agents: [builder_agent_enhanced, deploy_agent]
