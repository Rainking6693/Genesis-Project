# MONITORING ENDPOINTS
# ============================================
# Service health checks (after deployment):
# - A2A Service: https://<railway-domain>/health
# - Skyvern: https://<railway-domain-skyvern>/health
# - OCR Service: https://<railway-domain-ocr>/health
#
# Railway dashboard:
# - https://railway.app/dashboard
#
# Metrics:
