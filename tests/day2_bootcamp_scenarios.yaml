    reward_weight: 1.5

  - id: I32
    name: "Content Strategy for Blog"
    difficulty: intermediate
    type: team
    squad: growth_squad
    agents: [analyst_agent, marketing_agent, seo_agent]
    task: |
      Analyst researches keywords. Marketing creates content calendar.
      SEO provides optimization guidelines.
    success_criteria:
      - keywords_researched: 10
      - content_calendar: true
      - seo_guidelines: true
    timeout_seconds: 300
    reward_weight: 1.5

  - id: I33
    name: "Landing Page A/B Test Plan"
    difficulty: intermediate
    type: team
    squad: growth_squad
    agents: [analyst_agent, marketing_agent]
    task: |
      Design A/B test for landing page headline and CTA.
      Include hypothesis, variants, success metrics.
    success_criteria:
      - hypothesis: true
      - variants: 2
      - metrics_defined: true
