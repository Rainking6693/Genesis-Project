# fly.toml for Genesis Backend (A2A FastAPI Service)
# App: genesis-backend

app = 'genesis-backend'
primary_region = 'dfw'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2

[env]
  GENESIS_ENV = "production"
  A2A_HOST = "0.0.0.0"
  PORT = "8000"
  A2A_PORT = "8000"
  PYTHONUNBUFFERED = "1"

