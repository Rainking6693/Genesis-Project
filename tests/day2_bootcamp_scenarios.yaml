      Builder creates a Next.js blog with static generation.
      Deploy sets up Vercel deployment with ISR configuration.
    success_criteria:
      - nextjs_valid: true
      - ssg_pages: true
      - isr_config: true
      - deploy_config: true
    timeout_seconds: 360
    reward_weight: 1.5

  - id: I28
    name: "Implement Authentication Flow"
