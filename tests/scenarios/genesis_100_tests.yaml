# Genesis 100 Test Scenarios
# Main Agents: analyst, builder_agent_enhanced, deploy, billing, emergency_error_specialist,
#              marketing, support, onboarding, qa, se_darwin, seo
# SE-Darwin runs with every test for continuous optimization

metadata:
  version: "2.0"
  created: "2025-11-28"
  description: "100 comprehensive tests for Genesis agents"
  se_darwin_enabled: true

# =============================================================================
# EASY TESTS (E01-E25): Single agent + Genesis Meta + SE-Darwin
# Focus: Basic method calls with valid inputs
# =============================================================================

easy_tests:
  # Analyst Agent Tests
  - id: E01
    name: "Analyst analyze basic metrics"
    difficulty: easy
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Analyze page views for the last week"
    method: analyze_metrics
    inputs:
      metric_names: ["page_views", "sessions", "bounce_rate"]
      time_period: "7d"
      granularity: "daily"

  - id: E02
    name: "Analyst generate simple dashboard"
    difficulty: easy
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Create a basic traffic dashboard"
    method: generate_dashboard
    inputs:
      dashboard_name: "Traffic Overview"
      widgets: ["line_chart", "pie_chart"]
      refresh_interval_seconds: 300

  - id: E03
    name: "Analyst predict trends"
    difficulty: easy
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Forecast revenue for next 30 days"
    method: predict_trends
    inputs:
      metric_name: "revenue"
      forecast_horizon_days: 30
      model_type: "linear"

  # Builder Agent Tests
  - id: E04
    name: "Builder generate frontend"
    difficulty: easy
    agents: [genesis_meta, builder_agent_enhanced, se_darwin_agent]
    task: "Generate a landing page"
    method: generate_frontend
    inputs:
      app_name: "test-landing"
      features: ["hero_section", "contact_form"]
      pages: ["index", "about"]

  - id: E05
    name: "Builder generate backend"
    difficulty: easy
    agents: [genesis_meta, builder_agent_enhanced, se_darwin_agent]
    task: "Generate REST API endpoints"
    method: generate_backend
    inputs:
      app_name: "test-api"
      api_routes: ["/users", "/products"]
      auth_required: true

  - id: E06
    name: "Builder generate config"
    difficulty: easy
    agents: [genesis_meta, builder_agent_enhanced, se_darwin_agent]
    task: "Generate project configuration"
    method: generate_config
    inputs:
      app_name: "test-app"
      env_vars: ["DATABASE_URL", "API_KEY"]

  # Deploy Agent Tests
  - id: E07
    name: "Deploy validate deployment"
    difficulty: easy
    agents: [genesis_meta, deploy_agent, se_darwin_agent]
    task: "Validate app before deployment"
    method: validate_deployment
    inputs:
      app_path: "tests/fixtures/sample_app"
      checks: ["syntax", "dependencies"]

  - id: E08
    name: "Deploy get status"
    difficulty: easy
    agents: [genesis_meta, deploy_agent, se_darwin_agent]
    task: "Check deployment status"
    method: get_deployment_status
    inputs:
      app_path: "tests/fixtures/sample_app"

  # Billing Agent Tests
  - id: E09
    name: "Billing process payment"
    difficulty: easy
    agents: [genesis_meta, billing_agent, se_darwin_agent]
    task: "Process a credit card payment"
    method: process_payment
    inputs:
      customer_id: "CUST-001"
      amount: 99.99
      payment_method: "credit_card"
      currency: "USD"

  - id: E10
    name: "Billing generate invoice"
    difficulty: easy
    agents: [genesis_meta, billing_agent, se_darwin_agent]
    task: "Generate customer invoice"
    method: generate_invoice
    inputs:
      customer_id: "CUST-001"
      line_items: [{"description": "Pro Plan", "amount": 99.99}]
      due_date: "2025-12-15"

  - id: E11
    name: "Billing subscription status"
    difficulty: easy
    agents: [genesis_meta, billing_agent, se_darwin_agent]
    task: "Check subscription status"
    method: get_subscription_status
    inputs:
      customer_id: "CUST-001"

  # Emergency Error Specialist Tests
  - id: E12
    name: "Emergency diagnose database error"
    difficulty: easy
    agents: [genesis_meta, emergency_error_specialist_agent, se_darwin_agent]
    task: "Diagnose database connection failure"
    method: diagnose_error
    inputs:
      error_context:
        error_message: "Connection refused to database server"
        error_type: "database_connection"
        component_name: "postgresql"

  - id: E13
    name: "Emergency diagnose API error"
    difficulty: easy
    agents: [genesis_meta, emergency_error_specialist_agent, se_darwin_agent]
    task: "Diagnose API 429 error"
    method: diagnose_error
    inputs:
      error_context:
        error_message: "Rate limit exceeded"
        error_type: "api_rate_limit"
        component_name: "stripe_api"

  # Marketing Agent Tests
  - id: E14
    name: "Marketing analyze market"
    difficulty: easy
    agents: [genesis_meta, marketing_agent, se_darwin_agent]
    task: "Analyze SaaS market segment"
    method: analyze_market
    inputs:
      market_segment: "B2B SaaS"
      competitors: ["competitor1", "competitor2"]
      keywords: ["productivity", "automation"]

  - id: E15
    name: "Marketing generate content"
    difficulty: easy
    agents: [genesis_meta, marketing_agent, se_darwin_agent]
    task: "Generate blog content"
    method: generate_content
    inputs:
      content_type: "blog_post"
      topic: "AI in Business"
      num_pieces: 1
      tone: "professional"

  # Support Agent Tests
  - id: E16
    name: "Support create ticket"
    difficulty: easy
    agents: [genesis_meta, support_agent, se_darwin_agent]
    task: "Create a support ticket"
    method: create_ticket
    inputs:
      customer_id: "CUST-001"
      issue_description: "Cannot login to dashboard"
      priority: "medium"
      category: "authentication"

  - id: E17
    name: "Support search knowledge base"
    difficulty: easy
    agents: [genesis_meta, support_agent, se_darwin_agent]
    task: "Search for password reset docs"
    method: search_knowledge_base
    inputs:
      query: "password reset"
      category: "account"

  # Onboarding Agent Tests
  - id: E18
    name: "Onboarding create plan"
    difficulty: easy
    agents: [genesis_meta, onboarding_agent, se_darwin_agent]
    task: "Create onboarding plan for startup"
    method: create_onboarding_plan
    inputs:
      user_type: "startup_founder"
      company_size: "1-10"
      use_cases: ["analytics", "billing"]

  - id: E19
    name: "Onboarding guide setup"
    difficulty: easy
    agents: [genesis_meta, onboarding_agent, se_darwin_agent]
    task: "Guide user through step 1"
    method: guide_setup
    inputs:
      step_number: 1
      user_input: "My company is TechStartup Inc"

  # QA Agent Tests
  - id: E20
    name: "QA validate output"
    difficulty: easy
    agents: [genesis_meta, qa_agent, se_darwin_agent]
    task: "Validate JSON output"
    method: validate_output
    inputs:
      output: '{"status": "success", "data": []}'
      expectations: ["valid_json", "has_status_field"]

  - id: E21
    name: "QA generate test cases"
    difficulty: easy
    agents: [genesis_meta, qa_agent, se_darwin_agent]
    task: "Generate test cases for login"
    method: generate_test_cases
    inputs:
      feature_description: "User login with email and password"
      coverage_level: "basic"

  # SEO Agent Tests
  - id: E22
    name: "SEO keyword research"
    difficulty: easy
    agents: [genesis_meta, seo_agent, se_darwin_agent]
    task: "Research keywords for SaaS"
    method: keyword_research
    inputs:
      topic: "project management software"
      target_audience: "small business owners"
      num_keywords: 10

  - id: E23
    name: "SEO track rankings"
    difficulty: easy
    agents: [genesis_meta, seo_agent, se_darwin_agent]
    task: "Track keyword rankings"
    method: track_rankings
    inputs:
      domain: "example.com"
      keywords: ["project management", "task tracking"]
      tracking_period_days: 30

  # SE-Darwin Tests
  - id: E24
    name: "SE-Darwin basic evolution"
    difficulty: easy
    agents: [genesis_meta, se_darwin_agent]
    task: "Evolve a simple solution"
    method: evolve_solution
    inputs:
      task: {"type": "code_improvement", "description": "Optimize function performance"}
      initial_solution: "def slow_func(n): return sum(range(n))"
      evolutionary_config: {"generations": 2, "population_size": 3}

  - id: E25
    name: "SE-Darwin route task"
    difficulty: easy
    agents: [genesis_meta, se_darwin_agent]
    task: "Route optimization task"
    method: route_task
    inputs:
      task_description: "Improve code quality"
      priority: "medium"

# =============================================================================
# MEDIUM TESTS (M01-M25): Multi-step workflows with main agents
# Focus: Agent workflows, multi-method calls, error handling
# =============================================================================

medium_tests:
  # Analyst Workflows
  - id: M01
    name: "Analyst full dashboard creation"
    difficulty: medium
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Create comprehensive analytics dashboard"
    workflow:
      - method: analyze_metrics
        inputs:
          metric_names: ["revenue", "users", "churn_rate"]
          time_period: "30d"
          granularity: "weekly"
      - method: predict_trends
        inputs:
          metric_name: "revenue"
          forecast_horizon_days: 90
          model_type: "exponential"
      - method: generate_dashboard
        inputs:
          dashboard_name: "Executive Dashboard"
          widgets: ["line_chart", "bar_chart", "kpi_cards", "heatmap"]
          refresh_interval_seconds: 600

  - id: M02
    name: "Analyst anomaly detection workflow"
    difficulty: medium
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Detect and report anomalies"
    workflow:
      - method: detect_anomalies
        inputs:
          metric_name: "transaction_volume"
          sensitivity: "high"
          lookback_days: 14
      - method: create_business_report
        inputs:
          report_type: "anomaly_report"
          time_period: "14d"
          recipients: ["ops@company.com"]

  # Builder Workflows
  - id: M03
    name: "Builder full stack generation"
    difficulty: medium
    agents: [genesis_meta, builder_agent_enhanced, se_darwin_agent]
    task: "Generate complete application stack"
    workflow:
      - method: generate_frontend
        inputs:
          app_name: "saas-app"
          features: ["dashboard", "settings", "billing"]
          pages: ["index", "dashboard", "settings", "pricing"]
      - method: generate_backend
        inputs:
          app_name: "saas-app"
          api_routes: ["/api/users", "/api/subscriptions", "/api/analytics"]
          auth_required: true
      - method: generate_database
        inputs:
          app_name: "saas-app"
          tables: ["users", "subscriptions", "events"]
          relationships: ["users->subscriptions", "users->events"]

  - id: M04
    name: "Builder with code review"
    difficulty: medium
    agents: [genesis_meta, builder_agent_enhanced, qa_agent, se_darwin_agent]
    task: "Generate and review code"
    workflow:
      - agent: builder_agent_enhanced
        method: generate_backend
        inputs:
          app_name: "reviewed-api"
          api_routes: ["/api/data"]
          auth_required: true
      - agent: qa_agent
        method: evaluate_quality
        inputs:
          output_text: "Generated API code"
          criteria: ["code_style", "security", "performance"]

  # Deploy Workflows
  - id: M05
    name: "Deploy full deployment workflow"
    difficulty: medium
    agents: [genesis_meta, deploy_agent, se_darwin_agent]
    task: "Validate and deploy application"
    workflow:
      - method: validate_deployment
        inputs:
          app_path: "tests/fixtures/sample_app"
          checks: ["syntax", "dependencies", "security"]
      - method: configure_environment
        inputs:
          platform: "github-pages"
          env_vars: {"NODE_ENV": "production"}
          secrets: []
      - method: deploy
        inputs:
          app_path: "tests/fixtures/sample_app"
          target_platform: "github-pages"
          environment: "production"

  # Billing Workflows
  - id: M06
    name: "Billing subscription lifecycle"
    difficulty: medium
    agents: [genesis_meta, billing_agent, se_darwin_agent]
    task: "Manage full subscription lifecycle"
    workflow:
      - method: manage_subscription
        inputs:
          customer_id: "CUST-002"
          plan_id: "pro-monthly"
          action: "create"
      - method: process_payment
        inputs:
          customer_id: "CUST-002"
          amount: 49.99
          payment_method: "credit_card"
          currency: "USD"
      - method: generate_invoice
        inputs:
          customer_id: "CUST-002"
          line_items: [{"description": "Pro Monthly", "amount": 49.99}]
          due_date: "2025-12-01"

  - id: M07
    name: "Billing refund workflow"
    difficulty: medium
    agents: [genesis_meta, billing_agent, se_darwin_agent]
    task: "Process refund with reporting"
    workflow:
      - method: issue_refund
        inputs:
          transaction_id: "TXN-12345"
          amount: 25.00
          reason: "Service cancellation"
      - method: generate_revenue_report
        inputs:
          start_date: "2025-11-01"
          end_date: "2025-11-30"
          breakdown_by: "transaction_type"

  # Emergency Error Workflows
  - id: M08
    name: "Emergency full diagnosis and fix"
    difficulty: medium
    agents: [genesis_meta, emergency_error_specialist_agent, se_darwin_agent]
    task: "Diagnose and fix database error"
    workflow:
      - method: diagnose_error
        inputs:
          error_context:
            error_message: "Connection pool exhausted"
            error_type: "database_connection"
            component_name: "postgresql_pool"
      - method: fix_database_error
        inputs:
          error: "Connection pool exhausted"
          context: {database_type: "postgresql", pool_size: 10}
      - method: validate_fix
        inputs:
          diagnosis: {root_cause: "pool_exhaustion"}
          original_error: "Connection pool exhausted"

  # Marketing Workflows
  - id: M09
    name: "Marketing campaign creation"
    difficulty: medium
    agents: [genesis_meta, marketing_agent, se_darwin_agent]
    task: "Create marketing campaign"
    workflow:
      - method: analyze_market
        inputs:
          market_segment: "Enterprise SaaS"
          competitors: ["salesforce", "hubspot"]
          keywords: ["CRM", "sales automation"]
      - method: create_campaign
        inputs:
          campaign_name: "Q4 Enterprise Push"
          target_audience: "enterprise_decision_makers"
          budget: 2000
          duration_days: 30

  - id: M10
    name: "Marketing funnel optimization"
    difficulty: medium
    agents: [genesis_meta, marketing_agent, analyst_agent, se_darwin_agent]
    task: "Optimize conversion funnel"
    workflow:
      - agent: analyst_agent
        method: analyze_metrics
        inputs:
          metric_names: ["conversion_rate", "drop_off_rate"]
          time_period: "30d"
          granularity: "daily"
      - agent: marketing_agent
        method: optimize_funnel
        inputs:
          current_metrics: {conversion_rate: 0.02, drop_off_rate: 0.45}
          optimization_goal: "increase_conversion"

  # Support Workflows
  - id: M11
    name: "Support ticket resolution"
    difficulty: medium
    agents: [genesis_meta, support_agent, se_darwin_agent]
    task: "Handle support ticket end-to-end"
    workflow:
      - method: create_ticket
        inputs:
          customer_id: "CUST-VIP-001"
          issue_description: "Payment not processing"
          priority: "high"
          category: "billing"
      - method: search_knowledge_base
        inputs:
          query: "payment processing issues"
          category: "billing"
      - method: respond_to_ticket
        inputs:
          ticket_id: "TKT-001"
          response_text: "We found a solution for your payment issue"
          include_resources: true

  - id: M12
    name: "Support escalation workflow"
    difficulty: medium
    agents: [genesis_meta, support_agent, emergency_error_specialist_agent, se_darwin_agent]
    task: "Escalate and diagnose critical issue"
    workflow:
      - agent: support_agent
        method: create_ticket
        inputs:
          customer_id: "CUST-ENT-001"
          issue_description: "System completely down"
          priority: "critical"
          category: "outage"
      - agent: support_agent
        method: escalate_ticket
        inputs:
          ticket_id: "TKT-CRIT-001"
          escalation_reason: "Complete system outage"
          escalation_tier: "tier3"
      - agent: emergency_error_specialist_agent
        method: diagnose_error
        inputs:
          error_context:
            error_message: "Service unavailable"
            error_type: "infrastructure"
            component_name: "api_gateway"

  # Onboarding Workflows
  - id: M13
    name: "Onboarding complete journey"
    difficulty: medium
    agents: [genesis_meta, onboarding_agent, se_darwin_agent]
    task: "Complete user onboarding"
    workflow:
      - method: create_onboarding_plan
        inputs:
          user_type: "enterprise_admin"
          company_size: "100-500"
          use_cases: ["analytics", "billing", "support"]
      - method: guide_setup
        inputs:
          step_number: 1
          user_input: "Enterprise Corp"
      - method: collect_preferences
        inputs:
          category: "notifications"
          options: ["email", "slack", "in_app"]
      - method: generate_getting_started
        inputs:
          user_id: "USER-001"
          role: "admin"

  # QA Workflows
  - id: M14
    name: "QA comprehensive testing"
    difficulty: medium
    agents: [genesis_meta, qa_agent, se_darwin_agent]
    task: "Run comprehensive QA suite"
    workflow:
      - method: generate_test_cases
        inputs:
          feature_description: "User authentication with MFA"
          coverage_level: "comprehensive"
      - method: test_functionality
        inputs:
          feature_name: "mfa_authentication"
          test_cases: ["valid_code", "expired_code", "invalid_code"]
      - method: evaluate_quality
        inputs:
          output_text: "Test results summary"
          criteria: ["coverage", "edge_cases", "security"]

  # SEO Workflows
  - id: M15
    name: "SEO full optimization"
    difficulty: medium
    agents: [genesis_meta, seo_agent, se_darwin_agent]
    task: "Complete SEO optimization"
    workflow:
      - method: keyword_research
        inputs:
          topic: "cloud hosting"
          target_audience: "developers"
          num_keywords: 20
      - method: optimize_content
        inputs:
          content_url: "https://example.com/blog/cloud"
          target_keywords: ["cloud hosting", "scalable infrastructure"]
          optimization_type: "on_page"
      - method: generate_seo_report
        inputs:
          domain: "example.com"
          start_date: "2025-11-01"
          end_date: "2025-11-30"

  # SE-Darwin Workflows
  - id: M16
    name: "SE-Darwin with QA validation"
    difficulty: medium
    agents: [genesis_meta, se_darwin_agent, qa_agent]
    task: "Evolve solution with QA"
    workflow:
      - agent: se_darwin_agent
        method: evolve_solution
        inputs:
          task: {type: "algorithm_optimization", description: "Optimize sorting algorithm"}
          initial_solution: "def sort(arr): return sorted(arr)"
          evolutionary_config: {generations: 3, population_size: 5}
      - agent: qa_agent
        method: validate_output
        inputs:
          output: "Evolved sorting solution"
          expectations: ["faster_than_baseline", "correct_output"]

  # Multi-Agent Collaboration
  - id: M17
    name: "Builder + Deploy pipeline"
    difficulty: medium
    agents: [genesis_meta, builder_agent_enhanced, deploy_agent, se_darwin_agent]
    task: "Build and deploy application"
    workflow:
      - agent: builder_agent_enhanced
        method: generate_frontend
        inputs:
          app_name: "deploy-test"
          features: ["landing"]
          pages: ["index"]
      - agent: deploy_agent
        method: validate_deployment
        inputs:
          app_path: "businesses/deploy-test"
          checks: ["syntax", "dependencies"]

  - id: M18
    name: "Analyst + Marketing insights"
    difficulty: medium
    agents: [genesis_meta, analyst_agent, marketing_agent, se_darwin_agent]
    task: "Generate marketing insights from data"
    workflow:
      - agent: analyst_agent
        method: analyze_metrics
        inputs:
          metric_names: ["traffic_source", "conversion_by_channel"]
          time_period: "30d"
          granularity: "weekly"
      - agent: marketing_agent
        method: generate_content
        inputs:
          content_type: "insight_report"
          topic: "Traffic analysis insights"
          num_pieces: 1
          tone: "data_driven"

  - id: M19
    name: "Support + Billing coordination"
    difficulty: medium
    agents: [genesis_meta, support_agent, billing_agent, se_darwin_agent]
    task: "Handle billing-related support"
    workflow:
      - agent: support_agent
        method: create_ticket
        inputs:
          customer_id: "CUST-003"
          issue_description: "Overcharged on last invoice"
          priority: "high"
          category: "billing"
      - agent: billing_agent
        method: get_payment_history
        inputs:
          customer_id: "CUST-003"
          limit: 5
      - agent: billing_agent
        method: issue_refund
        inputs:
          transaction_id: "TXN-OVERPAY"
          amount: 10.00
          reason: "Billing correction"

  - id: M20
    name: "QA + Builder integration"
    difficulty: medium
    agents: [genesis_meta, qa_agent, builder_agent_enhanced, se_darwin_agent]
    task: "Test-driven development"
    workflow:
      - agent: qa_agent
        method: generate_test_cases
        inputs:
          feature_description: "REST API for user management"
          coverage_level: "comprehensive"
      - agent: builder_agent_enhanced
        method: generate_backend
        inputs:
          app_name: "tdd-api"
          api_routes: ["/users", "/users/{id}"]
          auth_required: true

  - id: M21
    name: "Emergency + Deploy recovery"
    difficulty: medium
    agents: [genesis_meta, emergency_error_specialist_agent, deploy_agent, se_darwin_agent]
    task: "Diagnose and recover deployment"
    workflow:
      - agent: emergency_error_specialist_agent
        method: diagnose_error
        inputs:
          error_context:
            error_message: "Deployment failed - container crash"
            error_type: "deployment"
            component_name: "docker_container"
      - agent: deploy_agent
        method: rollback_deployment
        inputs:
          deployment_id: "DEPLOY-FAIL-001"
          target_version: "v1.0.0"

  - id: M22
    name: "Onboarding + Support handoff"
    difficulty: medium
    agents: [genesis_meta, onboarding_agent, support_agent, se_darwin_agent]
    task: "Transition user to support"
    workflow:
      - agent: onboarding_agent
        method: track_progress
        inputs:
          user_id: "USER-NEW-001"
          milestone: "completed_setup"
      - agent: support_agent
        method: remember_customer_fact
        inputs:
          customer_id: "USER-NEW-001"
          fact_category: "onboarding"
          fact_content: "Completed full onboarding on 2025-11-28"

  - id: M23
    name: "SEO + Content optimization"
    difficulty: medium
    agents: [genesis_meta, seo_agent, content_agent, se_darwin_agent]
    task: "SEO-optimized content creation"
    workflow:
      - agent: seo_agent
        method: keyword_research
        inputs:
          topic: "remote work tools"
          target_audience: "remote teams"
          num_keywords: 15
      - agent: content_agent
        method: generate_content
        inputs:
          content_type: "blog_post"
          topic: "Best remote work tools for 2025"
          num_pieces: 1
          tone: "helpful"

  - id: M24
    name: "Billing + Finance reporting"
    difficulty: medium
    agents: [genesis_meta, billing_agent, finance_agent, se_darwin_agent]
    task: "Financial reconciliation"
    workflow:
      - agent: billing_agent
        method: generate_revenue_report
        inputs:
          start_date: "2025-11-01"
          end_date: "2025-11-30"
          breakdown_by: "product"
      - agent: finance_agent
        method: analyze_financials
        inputs:
          financial_data: {revenue: 50000, expenses: 30000}
          analysis_type: "profitability"

  - id: M25
    name: "Analyst + SE-Darwin optimization"
    difficulty: medium
    agents: [genesis_meta, analyst_agent, se_darwin_agent]
    task: "Optimize analysis workflow"
    workflow:
      - agent: analyst_agent
        method: route_analysis_task
        inputs:
