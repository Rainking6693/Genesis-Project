# fly.toml for Genesis Frontend (Dashboard Flask App)
# App: genesis-frontend

app = 'genesis-frontend'
primary_region = 'dfw'

[build]
  dockerfile = "Dockerfile.frontend"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  FLASK_ENV = "production"
  FLASK_APP = "app.py"
  PORT = "5000"

