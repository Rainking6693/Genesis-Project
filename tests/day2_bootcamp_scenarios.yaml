    timeout_seconds: 180
    reward_weight: 1.5

  - id: I39
    name: "Fix CORS Configuration"
    difficulty: intermediate
    type: solo
    agent: emergency_error_specialist_agent
    task: |
      Diagnose and fix CORS issues preventing API calls.
      Implement proper CORS headers and preflight handling.
    success_criteria:
