# Day 2 Bootcamp - Batch 2: 100 Test Scenarios
# Genesis + 11 Agents: Advanced Website Building & Operations
# IDs: B2_E01-E25 (Easy), B2_I01-I25 (Intermediate), B2_H01-H25 (Hard), B2_X01-X25 (Extreme)

metadata:
  version: "2.0"
  batch: 2
  total_tests: 100
  focus: "advanced_website_operations"
  agents:
    - genesis_meta
    - analyst_agent
    - builder_agent_enhanced
    - deploy_agent
    - billing_agent
    - emergency_error_specialist_agent
    - marketing_agent
    - support_agent
    - onboarding_agent
    - qa_agent
    - se_darwin_agent
    - seo_agent

squads:
  growth_squad:
    agents: [analyst_agent, marketing_agent, seo_agent, se_darwin_agent]
    focus: "market_analysis_and_growth"

  delivery_squad:
    agents: [builder_agent_enhanced, deploy_agent, emergency_error_specialist_agent, qa_agent]
    focus: "build_deploy_quality"

  customer_squad:
    agents: [onboarding_agent, support_agent, billing_agent]
    focus: "customer_lifecycle"

# =============================================================================
# EASY TESTS (B2_E01-E25): Solo Agent Tasks - Website Fundamentals
# =============================================================================
easy_tests:
  # Builder Agent Solo - UI Components (7 tests)
  - id: B2_E01
    name: "Create Testimonial Section"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Create a testimonials section with 3 customer reviews.
      Include: avatar, name, company, star rating, quote.
    success_criteria:
      - testimonial_cards: true
      - avatar_images: true
      - star_ratings: true
    timeout_seconds: 90
    reward_weight: 1.0

  - id: B2_E02
    name: "Build Pricing Cards"
