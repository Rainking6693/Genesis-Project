# Day 2 Bootcamp - 100 Test Scenarios
# Genesis + 11 Agents: Website Building & Running Focus
# Difficulty: Easy (25) -> Intermediate (25) -> Hard (25) -> Extreme (25)
# Types: Solo, Team (Squad), Genesis-Led

metadata:
  version: "1.0"
  total_tests: 100
  focus: "website_building_and_running"
  agents:
    - genesis_meta
    - analyst_agent
    - builder_agent_enhanced
    - deploy_agent
    - billing_agent
    - emergency_error_specialist_agent
    - marketing_agent
    - support_agent
    - onboarding_agent
    - qa_agent
    - se_darwin_agent
    - seo_agent

squads:
  growth_squad:
    agents: [analyst_agent, marketing_agent, seo_agent, se_darwin_agent]
    focus: "market_analysis_and_growth"

  delivery_squad:
    agents: [builder_agent_enhanced, deploy_agent, emergency_error_specialist_agent, qa_agent]
    focus: "build_deploy_quality"

  customer_squad:
    agents: [onboarding_agent, support_agent, billing_agent]
    focus: "customer_lifecycle"

# =============================================================================
# EASY TESTS (1-25): Solo Agent Tasks - Basic Website Operations
# =============================================================================
easy_tests:
  # Builder Agent Solo (5 tests)
  - id: E01
    name: "Create Static HTML Landing Page"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Create a simple static HTML landing page for a coffee shop.
      Must include: header, hero section, about section, contact info, footer.
    success_criteria:
      - valid_html: true
      - sections_present: ["header", "hero", "about", "contact", "footer"]
      - responsive_meta: true
    timeout_seconds: 120
    reward_weight: 1.0

  - id: E02
    name: "Add CSS Styling to Page"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Add modern CSS styling to an existing HTML page.
      Include: color scheme, typography, spacing, basic hover effects.
    success_criteria:
      - valid_css: true
      - color_scheme_defined: true
      - responsive_styles: true
    timeout_seconds: 90
    reward_weight: 1.0

  - id: E03
    name: "Create Contact Form"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Build an HTML contact form with name, email, message fields.
      Include basic client-side validation.
    success_criteria:
      - form_fields: ["name", "email", "message", "submit"]
      - validation_present: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E04
    name: "Create Navigation Menu"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Create a responsive navigation menu with 5 links.
      Mobile hamburger menu required.
    success_criteria:
      - nav_links: 5
      - mobile_menu: true
      - accessible: true
    timeout_seconds: 90
    reward_weight: 1.0

  - id: E05
    name: "Image Gallery Component"
    difficulty: easy
    type: solo
    agent: builder_agent_enhanced
    task: |
      Create a simple image gallery grid with lightbox functionality.
    success_criteria:
      - grid_layout: true
      - lightbox: true
      - alt_texts: true
    timeout_seconds: 90
    reward_weight: 1.0

  # Deploy Agent Solo (4 tests)
  - id: E06
    name: "Generate Netlify Config"
    difficulty: easy
    type: solo
    agent: deploy_agent
    task: |
      Create a netlify.toml configuration for a static site.
      Include build command and publish directory.
    success_criteria:
      - valid_toml: true
      - build_command: true
      - publish_dir: true
    timeout_seconds: 45
    reward_weight: 1.0

  - id: E07
    name: "Create GitHub Actions Workflow"
    difficulty: easy
    type: solo
    agent: deploy_agent
    task: |
      Create a basic CI/CD workflow for deploying on push to main.
    success_criteria:
      - valid_yaml: true
      - trigger_on_push: true
      - deploy_step: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E08
    name: "Generate Package.json"
    difficulty: easy
    type: solo
    agent: deploy_agent
    task: |
      Create a package.json with scripts for dev, build, and deploy.
    success_criteria:
      - valid_json: true
      - scripts_present: ["dev", "build"]
      - dependencies_section: true
    timeout_seconds: 45
    reward_weight: 1.0

  - id: E09
    name: "Create Dockerfile for Static Site"
    difficulty: easy
    type: solo
    agent: deploy_agent
    task: |
      Create a Dockerfile to serve a static site with nginx.
    success_criteria:
      - valid_dockerfile: true
      - nginx_base: true
      - expose_port: true
    timeout_seconds: 60
    reward_weight: 1.0

  # QA Agent Solo (4 tests)
  - id: E10
    name: "Write Unit Test for Form Validation"
    difficulty: easy
    type: solo
    agent: qa_agent
    task: |
      Write Jest unit tests for email validation function.
      Cover valid emails, invalid formats, edge cases.
    success_criteria:
      - test_count: 5
      - covers_valid: true
      - covers_invalid: true
    timeout_seconds: 90
    reward_weight: 1.0

  - id: E11
    name: "Create Accessibility Checklist"
    difficulty: easy
    type: solo
    agent: qa_agent
    task: |
      Create a comprehensive accessibility testing checklist for a landing page.
    success_criteria:
      - wcag_criteria: true
      - keyboard_nav: true
      - screen_reader: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E12
    name: "Performance Baseline Test"
    difficulty: easy
    type: solo
    agent: qa_agent
    task: |
      Create a Lighthouse CI configuration for performance testing.
    success_criteria:
      - valid_config: true
      - thresholds_defined: true
      - assertions: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E13
    name: "Write E2E Test for Navigation"
    difficulty: easy
    type: solo
    agent: qa_agent
    task: |
      Write a Playwright test that navigates through all menu items.
    success_criteria:
      - valid_playwright: true
      - all_links_tested: true
      - assertions_present: true
    timeout_seconds: 90
    reward_weight: 1.0

  # SEO Agent Solo (3 tests)
  - id: E14
    name: "Generate Meta Tags"
    difficulty: easy
    type: solo
    agent: seo_agent
    task: |
      Generate comprehensive meta tags for a SaaS landing page.
      Include title, description, keywords, Open Graph, Twitter cards.
    success_criteria:
      - title_tag: true
      - meta_description: true
      - og_tags: true
      - twitter_cards: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E15
    name: "Create Robots.txt"
    difficulty: easy
    type: solo
    agent: seo_agent
    task: |
      Create a robots.txt file with appropriate crawl rules.
    success_criteria:
      - valid_format: true
      - sitemap_reference: true
      - crawl_rules: true
    timeout_seconds: 30
    reward_weight: 1.0

  - id: E16
    name: "Generate Sitemap XML"
    difficulty: easy
    type: solo
    agent: seo_agent
    task: |
      Create a sitemap.xml for a 10-page website.
    success_criteria:
      - valid_xml: true
      - all_pages: true
      - lastmod_present: true
    timeout_seconds: 45
    reward_weight: 1.0

  # Marketing Agent Solo (3 tests)
  - id: E17
    name: "Write Hero Section Copy"
    difficulty: easy
    type: solo
    agent: marketing_agent
    task: |
      Write compelling hero section copy for a project management tool.
      Include headline, subheadline, and CTA text.
    success_criteria:
      - headline_length: [5, 12]  # words
      - value_proposition: true
      - cta_present: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E18
    name: "Create Feature Bullet Points"
    difficulty: easy
    type: solo
    agent: marketing_agent
    task: |
      Create 6 compelling feature bullet points for an analytics dashboard.
    success_criteria:
      - bullet_count: 6
      - benefit_focused: true
      - consistent_format: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E19
    name: "Write FAQ Section"
    difficulty: easy
    type: solo
    agent: marketing_agent
    task: |
      Write 5 FAQ entries for a subscription service.
    success_criteria:
      - faq_count: 5
      - clear_answers: true
      - addresses_concerns: true
    timeout_seconds: 90
    reward_weight: 1.0

  # Analyst Agent Solo (2 tests)
  - id: E20
    name: "Analyze Competitor Landing Page"
    difficulty: easy
    type: solo
    agent: analyst_agent
    task: |
      Analyze a competitor's landing page structure and identify:
      key sections, value propositions, CTAs, and conversion elements.
    success_criteria:
      - sections_identified: true
      - value_props_listed: true
      - cta_analysis: true
    timeout_seconds: 120
    reward_weight: 1.0

  - id: E21
    name: "Define Target Audience Persona"
    difficulty: easy
    type: solo
    agent: analyst_agent
    task: |
      Create a target audience persona for a B2B SaaS product.
    success_criteria:
      - demographics: true
      - pain_points: true
      - goals: true
      - buying_behavior: true
    timeout_seconds: 90
    reward_weight: 1.0

  # Support Agent Solo (2 tests)
  - id: E22
    name: "Create Help Article Template"
    difficulty: easy
    type: solo
    agent: support_agent
    task: |
      Create a help article template for "How to reset your password".
    success_criteria:
      - step_by_step: true
      - screenshots_placeholders: true
      - troubleshooting: true
    timeout_seconds: 60
    reward_weight: 1.0

  - id: E23
    name: "Draft Welcome Email"
    difficulty: easy
    type: solo
    agent: support_agent
    task: |
      Write a welcome email for new users with onboarding steps.
    success_criteria:
      - personalized_greeting: true
      - clear_next_steps: true
      - support_contact: true
    timeout_seconds: 60
    reward_weight: 1.0

  # Onboarding Agent Solo (1 test)
  - id: E24
    name: "Create Onboarding Checklist"
    difficulty: easy
    type: solo
    agent: onboarding_agent
    task: |
      Create a 7-step onboarding checklist for new SaaS users.
    success_criteria:
      - step_count: 7
      - progressive_complexity: true
      - completion_tracking: true
    timeout_seconds: 60
    reward_weight: 1.0

  # Billing Agent Solo (1 test)
  - id: E25
    name: "Create Pricing Table Structure"
    difficulty: easy
    type: solo
    agent: billing_agent
    task: |
      Design a 3-tier pricing table (Free, Pro, Enterprise).
    success_criteria:
      - three_tiers: true
      - features_per_tier: true
      - pricing_clear: true
      - cta_per_tier: true
    timeout_seconds: 90
    reward_weight: 1.0

# =============================================================================
# INTERMEDIATE TESTS (26-50): Solo & Team Tasks - Website Features
# =============================================================================
intermediate_tests:
  # Builder + Deploy Team (5 tests)
  - id: I26
    name: "Build and Deploy Landing Page"
    difficulty: intermediate
    type: team
    squad: delivery_squad
    agents: [builder_agent_enhanced, deploy_agent]
