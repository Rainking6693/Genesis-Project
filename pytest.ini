[pytest]
# Pytest configuration for Genesis Clean Deploy

# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --cov=infrastructure.ap2_service
    --cov=infrastructure.ap2_connector
    --cov=infrastructure.ap2_batch_approval
    --cov=infrastructure.ap2_circuit_breaker
    --cov=infrastructure.ap2_watchdog
    --cov=tests.fixtures.ap2_harness
    --cov=agents.marketing_agent
    --cov=agents.deploy_agent
    --cov=agents.content_agent
    --cov=agents.seo_agent
    --cov=agents.email_agent
    --cov=agents.analyst_agent
    --cov=agents.genesis_meta_agent
    --cov=agents.support_agent
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=85
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    gpu: marks tests requiring GPU
    unit: marks tests as unit tests
    benchmark: marks VOIX/Skyvern benchmark tests

# Coverage options
[coverage:run]
source =
    infrastructure.ap2_service
    infrastructure.ap2_connector
    infrastructure.ap2_batch_approval
    infrastructure.ap2_circuit_breaker
    infrastructure.ap2_watchdog
    tests.fixtures.ap2_harness
    agents.marketing_agent
    agents.deploy_agent
    agents.content_agent
    agents.seo_agent
    agents.email_agent
    agents.analyst_agent
    agents.genesis_meta_agent
    agents.support_agent
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */node_modules/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
