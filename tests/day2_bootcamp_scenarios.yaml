    timeout_seconds: 240
    reward_weight: 1.5

  # Mixed Intermediate (5 tests)
  - id: I46
    name: "API Rate Limiting"
    difficulty: intermediate
    type: solo
    agent: builder_agent_enhanced
    task: |
      Implement rate limiting middleware with token bucket algorithm.
