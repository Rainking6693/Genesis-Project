    timeout_seconds: 180
    reward_weight: 1.5

  - id: I34
    name: "Competitive Analysis Report"
    difficulty: intermediate
    type: solo
    agent: analyst_agent
    task: |
      Create detailed competitive analysis of 3 competitors.
      Include: features, pricing, positioning, strengths/weaknesses.
    success_criteria:
      - competitors: 3
