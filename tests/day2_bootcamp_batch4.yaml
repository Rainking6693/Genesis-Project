      Create a reusable REST API client with fetch wrapper.
      Include error handling and timeout support.
    success_criteria:
      - fetch_wrapper: true
      - error_handling: true
      - timeout_support: true
    timeout_seconds: 90
    reward_weight: 1.0

  - id: B4_E02
